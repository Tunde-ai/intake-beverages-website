<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InTake Beverages — Energy That Reflects You</title>
  <meta name="description" content="InTake Beverages LLC — luxury energy drinks crafted for hydration, performance, and lifestyle.">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>

  <!-- ============================================================
       SITE STRUCTURE — BEM Component Naming Convention
       ============================================================
       Block:    .header, .hero, .benefits, .marquee, etc.
       Element:  .header__logo, .hero__title, .benefits__card
       Modifier: .header--scrolled, .nav__link--active

       Each major section uses a top-level BEM block.
       Nested elements use double-underscore (__).
       State variants use double-hyphen (- -).

       File Structure:
         index.html          — page markup
         styles/main.css     — design tokens + all component styles
         scripts/main.js     — interactions (added in later phases)
         assets/images/      — optimized images (Phase 2)
         assets/video/       — background video (Phase 2)
       ============================================================ -->

  <!-- Header / Navigation — NAV-01 through NAV-05 -->
  <header class="header" id="header">
    <div class="header__container container">
      <a href="#hero" class="header__logo">InTake</a>
      <nav class="nav" id="nav">
        <ul class="nav__list">
          <li class="nav__item"><a href="#hero" class="nav__link nav__link--active">Home</a></li>
          <li class="nav__item"><a href="#products" class="nav__link">Shop</a></li>
        </ul>
      </nav>
      <div class="header__social">
        <a href="#" class="header__social-link" aria-label="Facebook">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        </a>
        <a href="#" class="header__social-link" aria-label="Twitter">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
        <a href="#" class="header__social-link" aria-label="YouTube">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        </a>
      </div>
      <button class="header__hamburger" id="hamburger" aria-label="Toggle navigation">
        <span class="header__hamburger-line"></span>
        <span class="header__hamburger-line"></span>
        <span class="header__hamburger-line"></span>
      </button>
    </div>
  </header>

  <!-- Hero — HERO-01 through HERO-05 -->
  <section class="hero" id="hero">
    <video class="hero__video" autoplay muted loop playsinline poster="assets/video/waterfall-poster.jpg">
      <source src="assets/video/waterfall-hero.mp4" type="video/mp4">
    </video>
    <div class="hero__overlay"></div>
    <div class="hero__content container">
      <h1 class="hero__title">InTake</h1>
      <p class="hero__subtitle">ENERGY + WATER</p>
      <p class="hero__tagline">ENERGY THAT REFLECTS YOU</p>
      <p class="hero__description">We exist for the energy, the impact, and the growth.</p>
    </div>
  </section>

  <!-- Benefits — "What You Intake?" -->
  <section class="benefits" id="benefits">
    <div class="benefits__container container">
      <!-- Cards added in Phase 4 -->
    </div>
  </section>

  <!-- Key Benefits -->
  <section class="key-benefits" id="key-benefits">
    <div class="key-benefits__container container">
      <!-- Columns added in Phase 4 -->
    </div>
  </section>

  <!-- Marquee -->
  <section class="marquee" id="marquee">
    <!-- Scrolling text added in Phase 4 -->
  </section>

  <!-- Campaign — "InTake Paris - Apricot Mist" -->
  <section class="campaign" id="campaign">
    <div class="campaign__container container">
      <!-- Two-column layout added in Phase 4 -->
    </div>
  </section>

  <!-- Overview -->
  <section class="overview" id="overview">
    <div class="overview__container container">
      <!-- Company overview added in Phase 4 -->
    </div>
  </section>

  <!-- About -->
  <section class="about" id="about">
    <div class="about__container container">
      <!-- About content added in Phase 4 -->
    </div>
  </section>

  <!-- Statistics -->
  <section class="statistics" id="statistics">
    <div class="statistics__container container">
      <!-- Stat counters added in Phase 4 -->
    </div>
  </section>

  <!-- Products -->
  <section class="products" id="products">
    <div class="products__container container">
      <!-- Product grid added in Phase 5 -->
    </div>
  </section>

  <!-- Testimonials -->
  <section class="testimonials" id="testimonials">
    <div class="testimonials__container container">
      <!-- Carousel added in Phase 5 -->
    </div>
  </section>

  <!-- Ingredients -->
  <section class="ingredients" id="ingredients">
    <div class="ingredients__container container">
      <!-- Ingredient cards added in Phase 5 -->
    </div>
  </section>

  <!-- Contact -->
  <section class="contact" id="contact">
    <div class="contact__container container">
      <!-- Contact form added in Phase 6 -->
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" id="footer">
    <div class="footer__container container">
      <!-- Footer content added in Phase 6 -->
    </div>
  </footer>

  <script src="scripts/main.js"></script>
</body>
</html>
